# Gradle configuration for 16 KB page size support
# This file is picked up by p4a's gradle build process

# Enable gradle build cache with proper invalidation
org.gradle.caching=true

# Use reasonable parallel settings
org.gradle.parallel=true
org.gradle.workers.max=4

# Ensure Java compatibility for modern AGP
org.gradle.jvmargs=-Xmx2048m

# Force module metadata to avoid stale artifacts
org.gradle.resolution.cache.size.mb=100

# NDK r28 produces 16 KB page-aligned .so files by default.
# This configuration ensures gradle doesn't override that with cached artifacts.
