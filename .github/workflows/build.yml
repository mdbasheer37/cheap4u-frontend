name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # Centralised version pins so SDK / NDK / build-tools always agree
  # with what buildozer.spec expects.
  ANDROID_COMPILE_SDK: "36"
  # Bump this whenever a toolchain change (e.g. the Cython pin, the NDK
  # version) needs to invalidate the .buildozer cache even though
  # buildozer.spec's hash alone wouldn't guarantee it - otherwise stale,
  # already-compiled artifacts from a previous run get silently reused.
  CACHE_VERSION: "v7-16kb-sdl2-and-packaging-fix"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.1.13356709"   # = NDK r28.1 - compiles 16 KB-page-aligned by default (see buildozer.spec)
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------------
      # System / native build dependencies that python-for-android (p4a)
      # needs on the host to cross-compile Kivy's C extensions.
      # ---------------------------------------------------------------
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl wget \
            build-essential pkg-config \
            autoconf automake libtool libltdl-dev \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            ccache

      # ---------------------------------------------------------------
      # Buildozer + Cython. Cython MUST be pinned to the 0.29.x line.
      # Cython 3.x generates C code that fails to compile for several
      # of Kivy's graphics .pyx files (observed as errors like
      # "member reference type 'int' is not a pointer" in
      # vertex_instructions.c). This is a known incompatibility between
      # current Kivy/python-for-android recipes and Cython 3 - the
      # buildozer maintainers pin below Cython 3.0 for the same reason.
      # ---------------------------------------------------------------
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --upgrade "buildozer>=1.5.0" "Cython==0.29.36"

      # ---------------------------------------------------------------
      # IMPORTANT: no `restore-keys` here, deliberately.
      #
      # A `restore-keys` prefix fallback means: if the exact key below
      # doesn't exist yet (which is *always* true right after CACHE_VERSION
      # or ANDROID_NDK_VERSION is bumped), actions/cache falls back to the
      # most recent cache matching the prefix - i.e. a cache built by the
      # *previous*, incompatible toolchain. python-for-android's own
      # incremental-build tracking (which recipes are "already built") is
      # keyed by recipe name/version/arch only, NOT by which NDK compiled
      # them, so a restored-but-stale `.buildozer/android/platform/build-*`
      # tree makes p4a skip rebuilding e.g. the SDL2 bootstrap entirely and
      # silently repackage the OLD, 4 KB-aligned libSDL2.so etc. into a
      # "new" build - even though buildozer.spec now says NDK r28+.
      #
      # This is exactly what happened: version code 10257 was already built
      # with android.ndk = 28.1.13356709 and still failed Google Play's
      # 16 KB check, because a warm cache from an older NDK never got
      # discarded. The key below also bakes in ANDROID_NDK_VERSION and a
      # hash of this workflow file itself, so a future toolchain edit
      # invalidates the cache automatically even if nobody remembers to
      # bump CACHE_VERSION by hand.
      # ---------------------------------------------------------------
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-global-${{ env.CACHE_VERSION }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('buildozer.spec', '.github/workflows/build.yml') }}

      - name: Cache Android SDK/NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK_VERSION }}

      # ---------------------------------------------------------------
      # Manually provision the Android SDK command-line tools.
      # We do this ourselves (instead of letting buildozer auto-download
      # the SDK) because buildozer's own SDK bootstrap is a common
      # source of CI failures: missing sdkmanager, unaccepted licenses,
      # and mismatched build-tools. Doing it explicitly here gives full
      # control and guarantees no interactive prompts.
      # ---------------------------------------------------------------
      - name: Install Android SDK command-line tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          # Resolve the current "latest" Linux command-line tools URL from
          # Google's own download page, with a known-good pinned fallback
          # in case the page layout changes.
          CMDLINE_URL=$(curl -fsSL https://developer.android.com/studio | \
            grep -o 'https://dl.google.com/android/repository/commandlinetools-linux-[0-9]*_latest.zip' | \
            head -n1 || true)
          if [ -z "$CMDLINE_URL" ]; then
            CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          fi
          echo "Using command-line tools: $CMDLINE_URL"

          curl -fsSL -o cmdline-tools.zip "$CMDLINE_URL"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          # sdkmanager requires the tools to live under cmdline-tools/latest
          rm -rf latest
          mv cmdline-tools latest

      - name: Accept all Android SDK licenses
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Install Android platform-tools, build-tools, platform and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" || true

          # Re-accept licenses once more now that new packages exist -
          # some sdkmanager versions write fresh license files per package.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Create legacy SDK path compatibility symlinks
        run: |
          set -euo pipefail
          # Buildozer's SDK-build-tools check looks for sdkmanager (and
          # friends) at the legacy `tools/bin/` location, even when
          # android.skip_update = True is set in buildozer.spec. Modern
          # sdkmanager only ships under `cmdline-tools/latest/bin/`, so
          # without this symlink buildozer thinks the SDK is missing
          # entirely and aborts.
          mkdir -p "$ANDROID_HOME/tools/bin"
          for tool in sdkmanager avdmanager apkanalyzer; do
            src="$ANDROID_HOME/cmdline-tools/latest/bin/$tool"
            if [ -e "$src" ]; then
              ln -sf "$src" "$ANDROID_HOME/tools/bin/$tool"
            fi
          done
          ls -la "$ANDROID_HOME/tools/bin"

      - name: Verify Android SDK / NDK / aidl are present
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "Android SDK looks good:"
          ls "$ANDROID_HOME"

      # ---------------------------------------------------------------
      # 16 KB PAGE SIZE FIX - part 2 of 2 (part 1 is the
      # android.add_packaging_options override already in buildozer.spec).
      #
      # python-for-android builds the SDL2 bootstrap (libSDL2.so,
      # libSDL2_image.so, libSDL2_mixer.so, libSDL2_ttf.so, and its own
      # libmain.so) by invoking `ndk-build` directly against
      # pythonforandroid/bootstraps/sdl2/build/jni/Application.mk. NDK
      # r28's "16 KB by default" behaviour does not reliably reach that
      # ndk-build invocation - this is a currently-open upstream gap
      # (https://github.com/kivy/python-for-android/issues/3165), and
      # multiple people report those exact 5 libraries staying 4 KB-aligned
      # even on NDK r28 with p4a's "develop" branch. python3, openssl,
      # sqlite3 and libffi are built via ordinary autotools/distutils and
      # DO pick up NDK r28's default correctly, so they are not affected.
      #
      # Fix: clone python-for-android ourselves at the exact tag
      # buildozer.spec pins (p4a.branch), append the two linker flags
      # Google's own migration guide specifies for ndk-build
      # (https://developer.android.com/guide/practices/page-sizes) to that
      # one Application.mk, and point buildozer.spec at this patched
      # checkout via p4a.source_dir instead of letting buildozer clone its
      # own (unpatched) copy.
      # ---------------------------------------------------------------
      - name: Prepare a 16 KB-page-size-patched python-for-android checkout
        run: |
          set -euo pipefail
          P4A_BRANCH=$(grep -E '^p4a\.branch' buildozer.spec | sed 's/.*=\s*//' | tr -d '[:space:]')
          if [ -z "$P4A_BRANCH" ]; then
            echo "::error::Could not read p4a.branch from buildozer.spec" >&2
            exit 1
          fi
          echo "Cloning python-for-android @ $P4A_BRANCH ..."
          rm -rf "$GITHUB_WORKSPACE/p4a-src"
          git clone --quiet --depth 1 --branch "$P4A_BRANCH" \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/p4a-src"

          APP_MK="$GITHUB_WORKSPACE/p4a-src/pythonforandroid/bootstraps/sdl2/build/jni/Application.mk"
          if [ ! -f "$APP_MK" ]; then
            echo "::error::Expected $APP_MK not found - python-for-android's bootstrap layout may have changed. Update this workflow step to match the new location." >&2
            exit 1
          fi

          if grep -q "max-page-size=16384" "$APP_MK"; then
            echo "Application.mk already contains the 16 KB linker flags - nothing to patch."
          else
            printf '\n# --- 16 KB memory page size support (Google Play requirement) ---\n# See buildozer.spec / this repo'"'"'s .github/workflows/build.yml for why this\n# is patched in here rather than relying on NDK r28'"'"'s default.\nAPP_LDFLAGS += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384\nAPP_CPPFLAGS += -D__BIONIC_NO_PAGE_SIZE_MACRO\n' >> "$APP_MK"
            echo "Patched $APP_MK:"
            tail -n 6 "$APP_MK"
          fi

      - name: Point buildozer.spec at the pre-installed SDK/NDK and the patched p4a checkout
        run: |
          set -euo pipefail
          # Buildozer's own internal pre-flight check (the one that
          # looks for build-tools/aidl before it even hands off to
          # python-for-android) does not reliably pick up the
          # APP_ANDROID_SDK_PATH / APP_ANDROID_NDK_PATH env-var
          # overrides - it falls back to its default
          # ~/.buildozer/android/platform/android-sdk path for that
          # specific check. Writing the real paths directly into
          # buildozer.spec removes any ambiguity.
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          sed -i "s|^#\?android.sdk_path *=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          sed -i "s|^#\?android.ndk_path *=.*|android.ndk_path = $NDK_PATH|" buildozer.spec
          # Use our patched python-for-android checkout instead of
          # buildozer's own (unpatched) auto-clone - see the previous step.
          sed -i "s|^#\?p4a.source_dir *=.*|p4a.source_dir = $GITHUB_WORKSPACE/p4a-src|" buildozer.spec
          echo "buildozer.spec now points to:"
          grep -n "^android.sdk_path\|^android.ndk_path\|^p4a.source_dir" buildozer.spec

      - name: Validate required signing secrets are present (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          HAS_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0
          [ "$HAS_KEYSTORE_B64" = "true" ] || { echo "::error::Missing required secret ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ "$HAS_KEYSTORE_PW" = "true" ] || { echo "::error::Missing required secret ANDROID_KEYSTORE_PASSWORD"; missing=1; }
          [ "$HAS_KEY_ALIAS" = "true" ] || { echo "::error::Missing required secret ANDROID_KEY_ALIAS"; missing=1; }
          [ "$HAS_KEY_PW" = "true" ] || { echo "::error::Missing required secret ANDROID_KEY_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "One or more required signing secrets are not set in Settings > Secrets and variables > Actions. Aborting release build." >&2
            exit 1
          fi
          echo "All required signing secrets are present."

      # ---------------------------------------------------------------
      # Belt-and-braces on top of the fixed cache key above: stamp the
      # restored .buildozer/ with a fingerprint of everything that affects
      # native-code output (NDK/SDK/build-tools versions, buildozer.spec,
      # this workflow file, and the p4a Application.mk patch). If it
      # doesn't match - including "no stamp found", e.g. an old cache
      # entry from before this step existed - wipe .buildozer and start
      # that arch's recipe builds from scratch. This guarantees a stale
      # 4 KB-aligned .so from a previous toolchain can never survive into
      # a build, even if a future edit to this workflow forgets to change
      # the cache key.
      # ---------------------------------------------------------------
      - name: Guarantee a clean rebuild whenever the native toolchain changes
        run: |
          set -euo pipefail
          APP_MK_HASH="no-patched-app-mk"
          if [ -f "$GITHUB_WORKSPACE/p4a-src/pythonforandroid/bootstraps/sdl2/build/jni/Application.mk" ]; then
            APP_MK_HASH=$(sha256sum "$GITHUB_WORKSPACE/p4a-src/pythonforandroid/bootstraps/sdl2/build/jni/Application.mk" | cut -d' ' -f1)
          fi
          FINGERPRINT="ndk=${ANDROID_NDK_VERSION};sdk=${ANDROID_COMPILE_SDK};bt=${ANDROID_BUILD_TOOLS};spec=$(sha256sum buildozer.spec | cut -d' ' -f1);appmk=${APP_MK_HASH}"
          STAMP_FILE=".buildozer/.toolchain_fingerprint"
          if [ -f "$STAMP_FILE" ] && [ "$(cat "$STAMP_FILE")" = "$FINGERPRINT" ]; then
            echo "Toolchain fingerprint unchanged since the last cached build - safe to reuse compiled recipes."
          else
            echo "Toolchain fingerprint changed (or none recorded yet) - wiping .buildozer for a guaranteed-clean rebuild."
            echo "  previous: $( [ -f "$STAMP_FILE" ] && cat "$STAMP_FILE" || echo '(none)')"
            echo "  current:  $FINGERPRINT"
            rm -rf .buildozer
            mkdir -p .buildozer
            echo "$FINGERPRINT" > "$STAMP_FILE"
          fi

      - name: Decode release keystore (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "Decoded keystore to a temporary file (not committed, cleaned up after the build)."

      # ---------------------------------------------------------------
      # Build the APK/AAB. buildozer.spec now has explicit android.sdk_path
      # / android.ndk_path pointing at the SDK/NDK we installed above,
      # and android.skip_update = True (also in buildozer.spec) tells
      # buildozer not to try to manage the SDK itself. `yes |` is a
      # final safety net so the process can never block on an
      # unexpected interactive prompt.
      #
      # build_type is "debug" (default, produces an unsigned .apk for
      # testing) or "release" (produces a signed .aab, the format Google
      # Play requires for all new app submissions - a plain .apk is no
      # longer accepted). To build a release AAB:
      #   1. Generate a keystore once, locally (keep it forever - you
      #      need the SAME keystore for every future update to this app):
      #        keytool -genkey -v -keystore upload-keystore.jks \
      #          -alias upload -keyalg RSA -keysize 2048 -validity 10000
      #      (If Google Play has approved an upload-key reset, use the
      #      new upload-keystore.jks / alias 'upload' issued for that
      #      reset instead of generating a fresh one.)
      #   2. Add these as GitHub repo secrets (Settings > Secrets and
      #      variables > Actions):
      #        ANDROID_KEYSTORE_BASE64   = base64 -w0 upload-keystore.jks
      #        ANDROID_KEYSTORE_PASSWORD = the keystore password you set
      #        ANDROID_KEY_ALIAS         = upload  (or whatever alias you used)
      #        ANDROID_KEY_PASSWORD      = the key/alias password you set
      #   3. Run this workflow manually (Actions tab > Run workflow) and
      #      choose "release" as the build type.
      #   4. Download the .aab artifact and upload it to Google Play.
      # ---------------------------------------------------------------
      - name: Build with Buildozer
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # NOTE: no LDFLAGS override here anymore. There used to be one
          # (-Wl,-z,max-page-size=16384) to hand-align native libraries to
          # 16 KB on NDK 25b, but that turned out to be an incomplete fix:
          # Google's own docs list a second required flag
          # (-z,common-page-size=16384) plus a macro define, and even with
          # both, it only aligns whatever build step actually receives the
          # flag - not guaranteed across every one of p4a's different
          # recipe build systems, and definitely not prebuilt .so files
          # from any wheel. NDK r28 (see buildozer.spec / ANDROID_NDK_VERSION
          # above) compiles everything 16 KB-aligned by default instead, so
          # there's nothing left for this step to pass through.
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building: $BUILD_TYPE"
          yes | buildozer -v android "$BUILD_TYPE" 2>&1 | tee "$GITHUB_WORKSPACE/buildozer_full.log" || true
          # If buildozer genuinely failed, there will be no output file and
          # the next step ("Locate built package") will fail the job with
          # a clear error - so it's safe to not treat `yes`'s harmless
          # broken-pipe exit (SIGPIPE, once buildozer finishes and closes
          # stdin) as a build failure here.

      - name: Show build error summary (only runs if build actually failed)
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/buildozer_full.log"
          if [ ! -f "$LOG" ]; then
            echo "No buildozer_full.log found - build step may not have run."
            exit 0
          fi
          if find bin -maxdepth 1 \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | grep -q .; then
            echo "Package was produced - skipping error summary."
            exit 0
          fi

          echo "===== Gradle failure block (if this was a gradle/aapt/packaging failure) ====="
          # Gradle always prints one of these markers when a build fails.
          # Print from the FIRST such marker to the end of the file, since
          # that's where the actual causing task/error lives - a generic
          # keyword grep gets flooded by repeated deprecation-warning
          # lines that also contain "fail" and pushes the real signal out
          # of a tail window.
          if grep -nE "FAILURE:|BUILD FAILED|What went wrong" "$LOG" > /dev/null; then
            FIRST_LINE=$(grep -nE "FAILURE:|BUILD FAILED|What went wrong" "$LOG" | head -n1 | cut -d: -f1)
            sed -n "${FIRST_LINE},\$p" "$LOG" | head -n 200
          else
            echo "(no Gradle FAILURE/BUILD FAILED marker found in log)"
          fi

          echo ""
          echo "===== AAPT / manifest / resource errors (if any) ====="
          grep -inE "aapt|AndroidManifest|resource.*error|duplicate.*resource" "$LOG" | tail -n 60 || echo "(none found)"

          echo ""
          echo "===== python-for-android 'Command failed' block (fallback) ====="
          if grep -n "# Command failed:" "$LOG" > /dev/null; then
            LAST_CMD_LINE=$(grep -n "# Command failed:" "$LOG" | tail -n1 | cut -d: -f1)
            sed -n "$((LAST_CMD_LINE>50 ? LAST_CMD_LINE-50 : 1)),${LAST_CMD_LINE}p" "$LOG"
          fi

          echo ""
          echo "===== Last 100 lines of raw output (final fallback) ====="
          tail -n 100 "$LOG"

      - name: Locate built package
        id: locate_apk
        run: |
          set -euo pipefail
          PKG_PATH=$(find bin -maxdepth 1 \( -name "*.apk" -o -name "*.aab" \) | head -n1)
          if [ -z "$PKG_PATH" ]; then
            echo "No APK/AAB found in bin/ - build failed." >&2
            exit 1
          fi
          echo "apk_path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 16 KB PAGE SIZE VERIFICATION - this is the actual proof, run fresh
      # on every build, that the fixes above worked. It is a hard gate:
      # the job fails here, before anything gets uploaded anywhere, if a
      # single native library is misaligned or still packaged compressed.
      # ---------------------------------------------------------------
      - name: Verify every native library is 16 KB page-size aligned
        id: verify_16kb
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          WORK="$RUNNER_TEMP/pagesize-check"
          rm -rf "$WORK"; mkdir -p "$WORK/extracted"
          cp "$PKG_PATH" "$WORK/pkg.zip"
          (cd "$WORK" && unzip -q pkg.zip -d extracted)

          mapfile -t SO_FILES < <(find "$WORK/extracted" -name "*.so" | sort)
          echo "Found ${#SO_FILES[@]} .so file(s) in $PKG_PATH"
          if [ "${#SO_FILES[@]}" -eq 0 ]; then
            echo "::error::No .so files found inside the package at all - something is badly wrong with this build, not just page size."
            exit 1
          fi

          FAIL=0
          printf "%-55s %-10s %s\n" "Library" "MinAlign" "Result"
          printf -- "---------------------------------------------------------------------------\n"
          for so in "${SO_FILES[@]}"; do
            rel="${so#"$WORK"/extracted/}"
            aligns=$(readelf -lW "$so" 2>/dev/null | awk '/LOAD/{print $NF}') || true
            if [ -z "$aligns" ]; then
              printf "%-55s %-10s %s\n" "$rel" "n/a" "SKIP (no LOAD segments - not a loadable ELF)"
              continue
            fi
            minalign=999999999
            for a in $aligns; do
              d=$((a))
              if [ "$d" -lt "$minalign" ]; then minalign=$d; fi
            done
            if [ "$minalign" -lt 16384 ]; then
              printf "%-55s %-10s %s\n" "$rel" "$minalign" "FAIL (< 16384)"
              FAIL=1
            else
              printf "%-55s %-10s %s\n" "$rel" "$minalign" "OK"
            fi
          done

          echo ""
          echo "== Zip packaging mode of native libraries (must be uncompressed) =="
          BAD_COMPRESSION=$(unzip -v "$WORK/pkg.zip" | awk '$NF ~ /\.so$/' | grep -v ' Stored ' || true)
          if [ -n "$BAD_COMPRESSION" ]; then
            echo "::error::Some .so files are stored COMPRESSED inside the package - the useLegacyPackaging=false override (android.add_packaging_options in buildozer.spec) did not take effect:"
            echo "$BAD_COMPRESSION"
            FAIL=1
          else
            echo "All .so entries are stored uncompressed - useLegacyPackaging=false took effect."
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::16 KB page-size verification FAILED. See the table/messages above for exactly which file and why. Do NOT upload this package to Google Play."
            exit 1
          fi
          echo ""
          echo "16 KB page-size verification PASSED for every native library in $PKG_PATH."

      # ---------------------------------------------------------------
      # Best-effort cross-check with bundletool - this exercises the same
      # split-APK generation logic Google Play itself runs, as an extra
      # confirmation beyond the direct check above. It is NOT a hard gate
      # (a bundletool/network hiccup here should not block a release that
      # already passed the authoritative check above), and only applies to
      # release .aab builds.
      # ---------------------------------------------------------------
      - name: Cross-check with bundletool (release AAB only, best-effort)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          case "$PKG_PATH" in
            *.aab) ;;
            *) echo "Not an .aab (got $PKG_PATH) - skipping bundletool cross-check."; exit 0 ;;
          esac

          BUNDLETOOL_VERSION="1.16.0"
          WORK="$RUNNER_TEMP/bundletool-check"
          rm -rf "$WORK"; mkdir -p "$WORK"
          curl -fsSL -o "$WORK/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          java -jar "$WORK/bundletool.jar" build-apks \
            --bundle="$PKG_PATH" \
            --output="$WORK/out.apks" \
            --mode=universal \
            --ks="$GITHUB_WORKSPACE/release.keystore" \
            --ks-pass="pass:${P4A_RELEASE_KEYSTORE_PASSWD}" \
            --ks-key-alias="${P4A_RELEASE_KEYALIAS}" \
            --key-pass="pass:${P4A_RELEASE_KEYALIAS_PASSWD}"

          mkdir -p "$WORK/apks_extracted"
          unzip -q "$WORK/out.apks" -d "$WORK/apks_extracted"
          UNIVERSAL_APK=$(find "$WORK/apks_extracted" -name "universal.apk" | head -n1)
          if [ -z "$UNIVERSAL_APK" ]; then
            echo "Could not find universal.apk in bundletool output - skipping (this does not affect the pass/fail result above)."
            exit 0
          fi

          mkdir -p "$WORK/universal_extracted"
          unzip -q "$UNIVERSAL_APK" -d "$WORK/universal_extracted"
          echo "== bundletool-generated universal APK: native library alignment =="
          BT_FAIL=0
          while IFS= read -r -d '' so; do
            aligns=$(readelf -lW "$so" 2>/dev/null | awk '/LOAD/{print $NF}') || true
            minalign=999999999
            for a in $aligns; do d=$((a)); [ "$d" -lt "$minalign" ] && minalign=$d; done
            rel="${so#"$WORK"/universal_extracted/}"
            if [ "$minalign" -lt 16384 ]; then
              echo "FAIL  $rel  align=$minalign"
              BT_FAIL=1
            else
              echo "OK    $rel  align=$minalign"
            fi
          done < <(find "$WORK/universal_extracted" -name "*.so" -print0)

          if [ "$BT_FAIL" -ne 0 ]; then
            echo "::warning::bundletool's own universal APK still shows a misaligned library - please re-check manually before uploading, even though the primary check above passed."
          else
            echo "bundletool cross-check confirms 16 KB alignment."
          fi
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release AAB is signed with the expected upload certificate
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          EXPECTED_SHA1: "C4:3D:05:63:A6:AE:A0:3D:D9:5F:28:65:97:29:58:38:38:CD:BA:AD"
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          echo "Inspecting signer certificate of $PKG_PATH ..."
          ACTUAL_SHA1=$(keytool -printcert -jarfile "$PKG_PATH" | grep -A1 "^Certificate fingerprints:" | grep "SHA1:" | sed 's/.*SHA1: //')
          if [ -z "$ACTUAL_SHA1" ]; then
            # Some keytool versions print the fingerprint without the
            # "Certificate fingerprints:" header line - fall back to a
            # direct SHA1 grep.
            ACTUAL_SHA1=$(keytool -printcert -jarfile "$PKG_PATH" | grep -m1 "SHA1:" | sed 's/.*SHA1: //')
          fi
          echo "Expected upload cert SHA-1: $EXPECTED_SHA1"
          echo "Actual AAB signer SHA-1:    $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::AAB is NOT signed with the expected new upload certificate. Google Play will reject this upload. Check that ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS secrets point at the new upload-keystore.jks (alias 'upload')." >&2
            exit 1
          fi
          echo "Signature verified: AAB is signed with the new upload certificate."

      - name: Clean up temporary keystore file
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            shred -u "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/release.keystore"
            echo "Temporary keystore file removed."
          else
            echo "No temporary keystore file present - nothing to clean up."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheap4U-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error

      - name: Upload full build log (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_full.log
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
