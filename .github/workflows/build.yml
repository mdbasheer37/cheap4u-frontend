name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # Centralised version pins so SDK / NDK / build-tools always agree
  # with what buildozer.spec expects.
  ANDROID_COMPILE_SDK: "36"
  # Bump this whenever a toolchain change (e.g. the Cython pin, the NDK
  # version) needs to invalidate the .buildozer cache even though
  # buildozer.spec's hash alone wouldn't guarantee it - otherwise stale,
  # already-compiled artifacts from a previous run get silently reused.
  # v7: NDK r28 alone does NOT make the build 16 KB-safe. NDK r28's
  # "aligned by default" behaviour only applies to code compiled directly
  # by the NDK's clang/lld toolchain (the recipes that use distutils,
  # autotools, CMake, etc - e.g. python3, openssl, sqlite3, libffi all
  # come out aligned for free). It does NOT apply to anything built with
  # ndk-build/Android.mk, because ndk-build's own make-based build system
  # does not opt in to the linker's new default and still emits 4 KB
  # LOAD segments unless told otherwise. In a Kivy/SDL2 app that's
  # exactly libSDL2.so, libSDL2_image.so, libSDL2_mixer.so,
  # libSDL2_ttf.so, AND python-for-android's own bootstrap libmain.so -
  # all four SDL2 recipes plus the app's native entry point are built via
  # ndk-build. This is a confirmed, still-open upstream gap as of 2026
  # (kivy/python-for-android#3165) - bumping the NDK version alone does
  # not fix it, which is exactly what the previous v6-ndk28 attempt
  # (NDK r28 with no further changes) got wrong: it fixed everything
  # EXCEPT the SDL2 family and libmain.so, which is exactly the failure
  # this pipeline was hitting. See the "Force 16 KB alignment for
  # ndk-build recipes" step below for the actual fix.
  CACHE_VERSION: "v7-ndkbuild-16k-align"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.1.13356709"   # NDK r28.1 - fixes every non-ndk-build recipe by default; see CACHE_VERSION note above for what it does NOT fix
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------------
      # System / native build dependencies that python-for-android (p4a)
      # needs on the host to cross-compile Kivy's C extensions.
      # ---------------------------------------------------------------
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl wget \
            build-essential pkg-config \
            autoconf automake libtool libltdl-dev \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            ccache

      # ---------------------------------------------------------------
      # Buildozer + Cython. Cython MUST be pinned to the 0.29.x line.
      # Cython 3.x generates C code that fails to compile for several
      # of Kivy's graphics .pyx files (observed as errors like
      # "member reference type 'int' is not a pointer" in
      # vertex_instructions.c). This is a known incompatibility between
      # current Kivy/python-for-android recipes and Cython 3 - the
      # buildozer maintainers pin below Cython 3.0 for the same reason.
      # ---------------------------------------------------------------
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --upgrade "buildozer>=1.5.0" "Cython==0.29.36"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-global-${{ env.CACHE_VERSION }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Android SDK/NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          # CACHE_VERSION is included here too: it's what we bump whenever
          # the *patch we apply to the installed NDK* changes (see the
          # "Force 16 KB alignment for ndk-build recipes" step), not just
          # when the NDK version string itself changes. Without this, a
          # cache-hit would silently restore an old, unpatched ndk-build
          # binary from before that step existed.
          key: android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.CACHE_VERSION }}

      # ---------------------------------------------------------------
      # Manually provision the Android SDK command-line tools.
      # We do this ourselves (instead of letting buildozer auto-download
      # the SDK) because buildozer's own SDK bootstrap is a common
      # source of CI failures: missing sdkmanager, unaccepted licenses,
      # and mismatched build-tools. Doing it explicitly here gives full
      # control and guarantees no interactive prompts.
      # ---------------------------------------------------------------
      - name: Install Android SDK command-line tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          # Resolve the current "latest" Linux command-line tools URL from
          # Google's own download page, with a known-good pinned fallback
          # in case the page layout changes.
          CMDLINE_URL=$(curl -fsSL https://developer.android.com/studio | \
            grep -o 'https://dl.google.com/android/repository/commandlinetools-linux-[0-9]*_latest.zip' | \
            head -n1 || true)
          if [ -z "$CMDLINE_URL" ]; then
            CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          fi
          echo "Using command-line tools: $CMDLINE_URL"

          curl -fsSL -o cmdline-tools.zip "$CMDLINE_URL"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          # sdkmanager requires the tools to live under cmdline-tools/latest
          rm -rf latest
          mv cmdline-tools latest

      - name: Accept all Android SDK licenses
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Install Android platform-tools, build-tools, platform and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" || true

          # Re-accept licenses once more now that new packages exist -
          # some sdkmanager versions write fresh license files per package.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Create legacy SDK path compatibility symlinks
        run: |
          set -euo pipefail
          # Buildozer's SDK-build-tools check looks for sdkmanager (and
          # friends) at the legacy `tools/bin/` location, even when
          # android.skip_update = True is set in buildozer.spec. Modern
          # sdkmanager only ships under `cmdline-tools/latest/bin/`, so
          # without this symlink buildozer thinks the SDK is missing
          # entirely and aborts.
          mkdir -p "$ANDROID_HOME/tools/bin"
          for tool in sdkmanager avdmanager apkanalyzer; do
            src="$ANDROID_HOME/cmdline-tools/latest/bin/$tool"
            if [ -e "$src" ]; then
              ln -sf "$src" "$ANDROID_HOME/tools/bin/$tool"
            fi
          done
          ls -la "$ANDROID_HOME/tools/bin"

      - name: Verify Android SDK / NDK / aidl are present
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "Android SDK looks good:"
          ls "$ANDROID_HOME"

      # ---------------------------------------------------------------
      # THE ACTUAL 16 KB FIX. NDK r28's toolchain compiles everything
      # 16 KB-aligned by default, EXCEPT modules built with ndk-build
      # (classic Android.mk/Application.mk GNU-make build system), which
      # does not inherit that new default. python-for-android builds
      # SDL2, SDL2_image, SDL2_mixer and SDL2_ttf - and its own bootstrap
      # entry point, libmain.so - exclusively via ndk-build. That's a
      # confirmed, still-open gap upstream (kivy/python-for-android#3165)
      # as of 2026: switching the NDK version alone does not touch these
      # five .so files, which is exactly why the previous NDK-r28-only
      # fix in this pipeline still produced an AAB that Google Play
      # rejected.
      #
      # Fix: intercept the actual ndk-build executable inside the
      # installed NDK and force every invocation to additionally pass
      #   APP_LDFLAGS      += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384
      #   APP_SUPPORT_FLEXIBLE_PAGE_SIZES = true
      # as GNU Make command-line variable overrides. Command-line
      # overrides win over anything Application.mk/Android.mk set
      # internally, and APP_LDFLAGS is applied by ndk-build to every
      # module in that build (SDL2 and friends, plus libmain.so), so this
      # is a single choke point that reliably reaches all five files
      # regardless of exactly how p4a's recipe classes invoke ndk-build.
      # It does not touch any non-ndk-build recipe (python3, openssl,
      # sqlite3, libffi, Pillow, Kivy/KivyMD's Cython extensions), which
      # NDK r28 already aligns correctly on its own - so this only
      # changes the files that actually needed it.
      - name: Force 16 KB alignment for ndk-build recipes (SDL2 family + bootstrap)
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          REAL="$NDK_DIR/ndk-build"
          WRAPPED_MARKER="$NDK_DIR/.ndk-build-16k-wrapped"

          if [ -f "$WRAPPED_MARKER" ]; then
            echo "ndk-build already wrapped for 16 KB alignment (cache hit) - skipping."
            exit 0
          fi

          if [ ! -f "$REAL" ]; then
            echo "::error::Expected ndk-build at $REAL but it does not exist." >&2
            exit 1
          fi

          mv "$REAL" "$NDK_DIR/ndk-build.real"

          # Written with printf (one line per argument) rather than a
          # heredoc, so this step's own YAML indentation can't end up
          # embedded in the generated script - a shebang line has to be
          # the literal first two bytes of the file or it won't be
          # honored.
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# Auto-generated wrapper: forces every ndk-build invocation p4a makes' \
            '# (SDL2, SDL2_image, SDL2_mixer, SDL2_ttf, and the bootstrap'"'"'s' \
            '# libmain.so) to link with 16 KB-aligned LOAD segments, since ndk-build' \
            '# does not do this by default even on NDK r28. The += command-line' \
            '# overrides append to (rather than replace) whatever the recipe'"'"'s own' \
            '# Android.mk/Application.mk already sets.' \
            'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'exec "$DIR/ndk-build.real" "$@" \' \
            '  APP_LDFLAGS+="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \' \
            '  APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true' \
            > "$REAL"
          chmod +x "$REAL"
          touch "$WRAPPED_MARKER"
          echo "Wrapped ndk-build at $REAL to force 16 KB alignment:"
          cat "$REAL"

      - name: Point buildozer.spec at the pre-installed SDK/NDK
        run: |
          set -euo pipefail
          # Buildozer's own internal pre-flight check (the one that
          # looks for build-tools/aidl before it even hands off to
          # python-for-android) does not reliably pick up the
          # APP_ANDROID_SDK_PATH / APP_ANDROID_NDK_PATH env-var
          # overrides - it falls back to its default
          # ~/.buildozer/android/platform/android-sdk path for that
          # specific check. Writing the real paths directly into
          # buildozer.spec removes any ambiguity.
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          sed -i "s|^#\?android.sdk_path *=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          sed -i "s|^#\?android.ndk_path *=.*|android.ndk_path = $NDK_PATH|" buildozer.spec
          echo "buildozer.spec now points to:"
          grep -n "^android.sdk_path\|^android.ndk_path" buildozer.spec

      - name: Validate required signing secrets are present (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          HAS_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0
          [ "$HAS_KEYSTORE_B64" = "true" ] || { echo "::error::Missing required secret ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ "$HAS_KEYSTORE_PW" = "true" ] || { echo "::error::Missing required secret ANDROID_KEYSTORE_PASSWORD"; missing=1; }
          [ "$HAS_KEY_ALIAS" = "true" ] || { echo "::error::Missing required secret ANDROID_KEY_ALIAS"; missing=1; }
          [ "$HAS_KEY_PW" = "true" ] || { echo "::error::Missing required secret ANDROID_KEY_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "One or more required signing secrets are not set in Settings > Secrets and variables > Actions. Aborting release build." >&2
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Decode release keystore (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "Decoded keystore to a temporary file (not committed, cleaned up after the build)."

      # ---------------------------------------------------------------
      # Build the APK/AAB. buildozer.spec now has explicit android.sdk_path
      # / android.ndk_path pointing at the SDK/NDK we installed above,
      # and android.skip_update = True (also in buildozer.spec) tells
      # buildozer not to try to manage the SDK itself. `yes |` is a
      # final safety net so the process can never block on an
      # unexpected interactive prompt.
      #
      # build_type is "debug" (default, produces an unsigned .apk for
      # testing) or "release" (produces a signed .aab, the format Google
      # Play requires for all new app submissions - a plain .apk is no
      # longer accepted). To build a release AAB:
      #   1. Generate a keystore once, locally (keep it forever - you
      #      need the SAME keystore for every future update to this app):
      #        keytool -genkey -v -keystore upload-keystore.jks \
      #          -alias upload -keyalg RSA -keysize 2048 -validity 10000
      #      (If Google Play has approved an upload-key reset, use the
      #      new upload-keystore.jks / alias 'upload' issued for that
      #      reset instead of generating a fresh one.)
      #   2. Add these as GitHub repo secrets (Settings > Secrets and
      #      variables > Actions):
      #        ANDROID_KEYSTORE_BASE64   = base64 -w0 upload-keystore.jks
      #        ANDROID_KEYSTORE_PASSWORD = the keystore password you set
      #        ANDROID_KEY_ALIAS         = upload  (or whatever alias you used)
      #        ANDROID_KEY_PASSWORD      = the key/alias password you set
      #   3. Run this workflow manually (Actions tab > Run workflow) and
      #      choose "release" as the build type.
      #   4. Download the .aab artifact and upload it to Google Play.
      # ---------------------------------------------------------------
      - name: Build with Buildozer
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # NOTE: no LDFLAGS override here anymore. There used to be one
          # (-Wl,-z,max-page-size=16384) to hand-align native libraries to
          # 16 KB on NDK 25b, but that turned out to be an incomplete fix:
          # Google's own docs list a second required flag
          # (-z,common-page-size=16384) plus a macro define, and even with
          # both, it only aligns whatever build step actually receives the
          # flag - not guaranteed across every one of p4a's different
          # recipe build systems, and definitely not prebuilt .so files
          # from any wheel. NDK r28 (see buildozer.spec / ANDROID_NDK_VERSION
          # above) compiles everything 16 KB-aligned by default instead, so
          # there's nothing left for this step to pass through.
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building: $BUILD_TYPE"
          yes | buildozer -v android "$BUILD_TYPE" 2>&1 | tee "$GITHUB_WORKSPACE/buildozer_full.log" || true
          # If buildozer genuinely failed, there will be no output file and
          # the next step ("Locate built package") will fail the job with
          # a clear error - so it's safe to not treat `yes`'s harmless
          # broken-pipe exit (SIGPIPE, once buildozer finishes and closes
          # stdin) as a build failure here.

      - name: Show build error summary (only runs if build actually failed)
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/buildozer_full.log"
          if [ ! -f "$LOG" ]; then
            echo "No buildozer_full.log found - build step may not have run."
            exit 0
          fi
          if find bin -maxdepth 1 \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | grep -q .; then
            echo "Package was produced - skipping error summary."
            exit 0
          fi

          echo "===== Gradle failure block (if this was a gradle/aapt/packaging failure) ====="
          # Gradle always prints one of these markers when a build fails.
          # Print from the FIRST such marker to the end of the file, since
          # that's where the actual causing task/error lives - a generic
          # keyword grep gets flooded by repeated deprecation-warning
          # lines that also contain "fail" and pushes the real signal out
          # of a tail window.
          if grep -nE "FAILURE:|BUILD FAILED|What went wrong" "$LOG" > /dev/null; then
            FIRST_LINE=$(grep -nE "FAILURE:|BUILD FAILED|What went wrong" "$LOG" | head -n1 | cut -d: -f1)
            sed -n "${FIRST_LINE},\$p" "$LOG" | head -n 200
          else
            echo "(no Gradle FAILURE/BUILD FAILED marker found in log)"
          fi

          echo ""
          echo "===== AAPT / manifest / resource errors (if any) ====="
          grep -inE "aapt|AndroidManifest|resource.*error|duplicate.*resource" "$LOG" | tail -n 60 || echo "(none found)"

          echo ""
          echo "===== python-for-android 'Command failed' block (fallback) ====="
          if grep -n "# Command failed:" "$LOG" > /dev/null; then
            LAST_CMD_LINE=$(grep -n "# Command failed:" "$LOG" | tail -n1 | cut -d: -f1)
            sed -n "$((LAST_CMD_LINE>50 ? LAST_CMD_LINE-50 : 1)),${LAST_CMD_LINE}p" "$LOG"
          fi

          echo ""
          echo "===== Last 100 lines of raw output (final fallback) ====="
          tail -n 100 "$LOG"

      - name: Locate built package
        id: locate_apk
        run: |
          set -euo pipefail
          PKG_PATH=$(find bin -maxdepth 1 \( -name "*.apk" -o -name "*.aab" \) | head -n1)
          if [ -z "$PKG_PATH" ]; then
            echo "No APK/AAB found in bin/ - build failed." >&2
            exit 1
          fi
          echo "apk_path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Hard verification gate: actually inspect the native libraries
      # that ended up inside the built package and fail the job if any
      # of them still has a 4 KB-aligned LOAD segment. This is what
      # proves the fix worked, rather than trusting the toolchain
      # versions in isolation - it's the same class of check Google Play
      # itself runs. Uses bundletool for .aab (to extract the real
      # installable APKs the way Play would) and readelf from the NDK we
      # already installed to inspect ELF program headers. Also checks
      # the AAB's own alignment metadata with `zipalign -c -P 16`, which
      # is the second, independent thing Play checks (uncompressed .so
      # entries must additionally sit at 16 KB-aligned offsets inside the
      # package, on top of the LOAD segments inside the .so themselves
      # being 16 KB-aligned).
      - name: Verify 16 KB page-size alignment of native libraries
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          NDK_DIR="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          READELF="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign"
          WORKDIR="$RUNNER_TEMP/16k-verify"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          check_so_dir() {
            # $1 = directory to recursively search for .so files
            local dir="$1"
            local bad=0
            while IFS= read -r -d '' so; do
              # Only 64-bit ABI dirs are required to be 16 KB-aligned;
              # Google does not require it for 32-bit arches. This repo
              # only ships arm64-v8a anyway (android.archs), so every .so
              # found here is in scope.
              local aligns
              aligns=$("$READELF" -lW "$so" 2>/dev/null | awk '/LOAD/ {print $NF}')
              if [ -z "$aligns" ]; then
                continue
              fi
              local min_align_hex
              min_align_hex=$(echo "$aligns" | sort -u | head -n1)
              local min_align_dec=$((min_align_hex))
              if [ "$min_align_dec" -lt 16384 ]; then
                echo "::error::NOT 16 KB-aligned: $so (smallest LOAD align: $min_align_hex)"
                bad=1
              else
                echo "OK (16 KB-aligned): $so"
              fi
            done < <(find "$dir" -name "*.so" -print0)
            return $bad
          }

          OVERALL_BAD=0

          case "$PKG_PATH" in
            *.aab)
              echo "=== Inspecting AAB via bundletool ==="
              BUNDLETOOL_JAR="$WORKDIR/bundletool.jar"
              # bundletool's release asset name is versioned
              # (bundletool-all-<version>.jar), so the generic
              # "/releases/latest/download/bundletool-all.jar" URL 404s -
              # it only works for an asset name that's identical on every
              # release. Resolve the real, current download URL from the
              # GitHub API instead, with a pinned last-known-good version
              # as a fallback if the API call itself fails (rate limiting,
              # network hiccup, etc).
              BUNDLETOOL_FALLBACK_URL="https://github.com/google/bundletool/releases/download/1.16.0/bundletool-all-1.16.0.jar"
              BUNDLETOOL_URL=$(curl -fsSL "https://api.github.com/repos/google/bundletool/releases/latest" \
                | grep -o '"browser_download_url": *"[^"]*bundletool-all[^"]*\.jar"' \
                | head -n1 \
                | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
              if [ -z "$BUNDLETOOL_URL" ]; then
                echo "Could not resolve latest bundletool release from the GitHub API - falling back to pinned 1.16.0."
                BUNDLETOOL_URL="$BUNDLETOOL_FALLBACK_URL"
              fi
              echo "Using bundletool: $BUNDLETOOL_URL"
              curl -fsSL -o "$BUNDLETOOL_JAR" "$BUNDLETOOL_URL"

              # Build real, installable split APKs the way Play would,
              # for a representative 64-bit device spec, then extract
              # them so we can inspect the actual .so files Play will
              # ship to users.
              java -jar "$BUNDLETOOL_JAR" build-apks \
                --bundle="$PKG_PATH" \
                --output="$WORKDIR/out.apks" \
                --mode=universal \
                --overwrite

              mkdir -p "$WORKDIR/universal"
              unzip -o "$WORKDIR/out.apks" universal.apk -d "$WORKDIR/universal" > /dev/null
              mkdir -p "$WORKDIR/universal_extracted"
              unzip -o "$WORKDIR/universal/universal.apk" "lib/*" -d "$WORKDIR/universal_extracted" > /dev/null || true

              echo "--- LOAD segment alignment (readelf) ---"
              check_so_dir "$WORKDIR/universal_extracted" || OVERALL_BAD=1

              echo "--- Zip-entry alignment (zipalign -P 16) ---"
              if "$ZIPALIGN" -c -v -P 16 4 "$WORKDIR/universal/universal.apk" > "$WORKDIR/zipalign.log" 2>&1; then
                echo "zipalign: universal.apk is correctly 16 KB zip-aligned."
              else
                echo "::error::zipalign reports the built APK is NOT 16 KB zip-aligned:"
                tail -n 40 "$WORKDIR/zipalign.log"
                OVERALL_BAD=1
              fi

              echo "--- Cross-check: raw .so files inside the .aab itself ---"
              mkdir -p "$WORKDIR/aab_raw"
              unzip -o "$PKG_PATH" "base/lib/*" -d "$WORKDIR/aab_raw" > /dev/null || true
              check_so_dir "$WORKDIR/aab_raw" || OVERALL_BAD=1
              ;;
            *.apk)
              echo "=== Inspecting APK directly ==="
              mkdir -p "$WORKDIR/apk_extracted"
              unzip -o "$PKG_PATH" "lib/*" -d "$WORKDIR/apk_extracted" > /dev/null || true
              check_so_dir "$WORKDIR/apk_extracted" || OVERALL_BAD=1
              ;;
            *)
              echo "::error::Unrecognized package type: $PKG_PATH" >&2
              exit 1
              ;;
          esac

          if [ "$OVERALL_BAD" -ne 0 ]; then
            echo "::error::One or more native libraries are still 4 KB-aligned. Google Play will reject this package for the 16 KB page-size requirement."
            exit 1
          fi
          echo "All native libraries are 16 KB page-size aligned."

      - name: Verify release AAB is signed with the expected upload certificate
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          EXPECTED_SHA1: "C4:3D:05:63:A6:AE:A0:3D:D9:5F:28:65:97:29:58:38:38:CD:BA:AD"
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          echo "Inspecting signer certificate of $PKG_PATH ..."
          ACTUAL_SHA1=$(keytool -printcert -jarfile "$PKG_PATH" | grep -A1 "^Certificate fingerprints:" | grep "SHA1:" | sed 's/.*SHA1: //')
          if [ -z "$ACTUAL_SHA1" ]; then
            # Some keytool versions print the fingerprint without the
            # "Certificate fingerprints:" header line - fall back to a
            # direct SHA1 grep.
            ACTUAL_SHA1=$(keytool -printcert -jarfile "$PKG_PATH" | grep -m1 "SHA1:" | sed 's/.*SHA1: //')
          fi
          echo "Expected upload cert SHA-1: $EXPECTED_SHA1"
          echo "Actual AAB signer SHA-1:    $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::AAB is NOT signed with the expected new upload certificate. Google Play will reject this upload. Check that ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS secrets point at the new upload-keystore.jks (alias 'upload')." >&2
            exit 1
          fi
          echo "Signature verified: AAB is signed with the new upload certificate."

      - name: Clean up temporary keystore file
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            shred -u "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/release.keystore"
            echo "Temporary keystore file removed."
          else
            echo "No temporary keystore file present - nothing to clean up."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheap4U-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error

      - name: Upload full build log (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_full.log
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
