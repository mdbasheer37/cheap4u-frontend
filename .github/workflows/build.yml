name: Build Android APK/AAB

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release = signed .aab for Google Play)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  # NDK r28c. This is the NDK python-for-android v2026.05.09 recommends, and
  # r28+ produces 16 KB-aligned ELF files by default (clang/lld + ndk-build).
  # No NDK patching, no ld.lld wrapper, no global LDFLAGS: whether it really
  # worked is decided by tools/verify_16kb.py on the finished .aab below.
  ANDROID_NDK_VERSION: "28.2.13676358"
  BUNDLETOOL_VERSION: "1.18.1"
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl wget \
            build-essential pkg-config \
            autoconf automake libtool libltdl-dev \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            ccache

      # Buildozer only needs a `cython` executable on the host to pass its
      # pre-flight check. Kivy/pyjnius/android are each compiled by p4a in an
      # isolated build environment with the Cython version *they* pin, so this
      # host pin does not affect how Kivy is built.
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --upgrade "buildozer>=1.5.0" "Cython==0.29.36"

      # -----------------------------------------------------------------
      # CACHES - designed so a stale native library can never be reused.
      #
      # 1. SDK/NDK: a plain toolchain install. It is NOT modified after
      #    installation any more (the old ndk-build / ld.lld patching is gone),
      #    so restoring it is safe. The key contains every version and a hash
      #    of this workflow.
      # 2. p4a *download* cache only (source tarballs). We deliberately do NOT
      #    cache ~/.buildozer or .buildozer as a whole: those contain compiled
      #    objects, per-recipe "already built" markers and dists, which is
      #    exactly how an old 4 KB-aligned libSDL2.so could be resurrected.
      #    There is also NO restore-keys fallback: a key miss = empty cache.
      # -----------------------------------------------------------------
      - name: Cache Android SDK/NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Cache p4a source downloads only (never compiled output)
        uses: actions/cache@v4
        with:
          path: .buildozer/android/platform/build-arm64-v8a/packages
          key: p4a-downloads-${{ hashFiles('buildozer.spec') }}

      - name: Install Android SDK command-line tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          rm -rf latest
          mv cmdline-tools latest

      - name: Install Android platform, build-tools and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          # `< <(yes)` instead of `yes |` so `set -o pipefail` does not trip on SIGPIPE.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" < <(yes)

      - name: Verify Android SDK / NDK are present
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aidl"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          grep -H "Pkg.Revision" "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/source.properties"

      - name: Legacy SDK path symlinks and buildozer.spec SDK/NDK paths
        run: |
          set -euo pipefail
          # buildozer's pre-flight check still looks for tools/bin/*.
          mkdir -p "$ANDROID_HOME/tools/bin"
          for tool in sdkmanager avdmanager apkanalyzer; do
            src="$ANDROID_HOME/cmdline-tools/latest/bin/$tool"
            [ -e "$src" ] && ln -sf "$src" "$ANDROID_HOME/tools/bin/$tool"
          done
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          sed -i "s|^#\?android.sdk_path *=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          sed -i "s|^#\?android.ndk_path *=.*|android.ndk_path = $NDK_PATH|" buildozer.spec
          grep -n "^android.sdk_path\|^android.ndk_path\|^android.ndk \|^requirements" buildozer.spec

      - name: Guarantee a clean native build (no stale .so can exist)
        run: |
          set -euo pipefail
          rm -rf bin
          # Only the source-download cache may exist. Any compiled artifact here is a bug.
          if [ -d .buildozer ]; then
            STALE=$(find .buildozer \( -name '*.so' -o -name '*.o' -o -name '*.a' -o -name '.mark-*' -path '*/build/*' \) 2>/dev/null | head -n 5)
            if [ -n "$STALE" ]; then
              echo "::error::Stale native build output found before the build:"; echo "$STALE"; exit 1
            fi
          fi
          echo "OK: no pre-built native artifacts present."

      - name: Validate required signing secrets are present (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          HAS_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0
          [ "$HAS_KEYSTORE_B64" = "true" ] || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ "$HAS_KEYSTORE_PW" = "true" ] || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD"; missing=1; }
          [ "$HAS_KEY_ALIAS" = "true" ] || { echo "::error::Missing secret ANDROID_KEY_ALIAS"; missing=1; }
          [ "$HAS_KEY_PW" = "true" ] || { echo "::error::Missing secret ANDROID_KEY_PASSWORD"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "All required signing secrets are present."

      - name: Decode release keystore (release builds only)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # Best-effort mirror for a flaky upstream host (freetype's savannah.gnu.org).
      # Never fails the job; p4a falls back to its own download.
      - name: Pre-fetch freetype source from a mirror
        continue-on-error: true
        run: |
          set +e
          FT_VERSION="2.14.1"
          DEST_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          DEST_FILE="$DEST_DIR/freetype-$FT_VERSION.tar.gz"
          mkdir -p "$DEST_DIR"
          [ -s "$DEST_FILE" ] && exit 0
          for URL in \
            "https://download.savannah.gnu.org/releases/freetype/freetype-$FT_VERSION.tar.gz" \
            "https://downloads.sourceforge.net/project/freetype/freetype2/$FT_VERSION/freetype-$FT_VERSION.tar.gz"
          do
            if curl -fL --connect-timeout 15 --max-time 90 --retry 2 -o "$DEST_FILE.tmp" "$URL"; then
              mv "$DEST_FILE.tmp" "$DEST_FILE"; exit 0
            fi
            rm -f "$DEST_FILE.tmp"
          done
          exit 0

      # The build's exit status is NOT swallowed any more (the old `|| true`
      # hid real failures until a later step).
      - name: Build with Buildozer
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building: $BUILD_TYPE"
          buildozer -v android "$BUILD_TYPE" < <(yes) 2>&1 | tee "$GITHUB_WORKSPACE/buildozer_full.log"
          rc=${PIPESTATUS[0]}
          echo "buildozer exit code: $rc"
          exit "$rc"

      - name: Show first real compiler/Gradle error (only if the build failed)
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/buildozer_full.log"
          [ -f "$LOG" ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" > /tmp/clean.log
          echo "===== first ' error:' lines ====="
          grep -n " error:" /tmp/clean.log | cut -c1-400 | head -n 15 || true
          echo "===== Gradle failure block ====="
          n=$(grep -nE "FAILURE:|BUILD FAILED|What went wrong" /tmp/clean.log | head -n1 | cut -d: -f1)
          [ -n "${n:-}" ] && sed -n "${n},\$p" /tmp/clean.log | head -n 120 || echo "(none)"

      - name: Locate built package
        id: locate_apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(bin/*.aab bin/*.apk)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No .aab/.apk found in bin/ - build failed."; exit 1; }
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            AABS=(bin/*.aab)
            [ ${#AABS[@]} -gt 0 ] || { echo "::error::Release build did not produce an .aab (check android.release_artifact = aab)."; exit 1; }
            PKG="${AABS[0]}"
          else
            PKG="${FILES[0]}"
          fi
          ls -la bin
          echo "apk_path=$PKG" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # HARD GATE: verify the FINAL package, not intermediate build files.
      #  1. every native .so in the .aab/.apk (plus .so files packed inside
      #     libpybundle.so / private.tar, i.e. every Kivy C-extension):
      #     every PT_LOAD segment must have 16 KB alignment
      #  2. .aab: BundleConfig page alignment must not be 4K
      #  3. bundletool -> universal APK: re-run the ELF check on the APK that
      #     Play-style tooling derives, and `zipalign -c -P 16`
      # -----------------------------------------------------------------
      - name: Verify 16 KB page-size compatibility of the FINAL package
        run: |
          set -euo pipefail
          PKG="${{ steps.locate_apk.outputs.apk_path }}"
          ZIPALIGN="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign"
          WORK="$RUNNER_TEMP/verify16k"; rm -rf "$WORK"; mkdir -p "$WORK"

          echo "##### 1) ELF PT_LOAD alignment of every native library in $PKG"
          python tools/verify_16kb.py "$PKG" --blame-dir .buildozer

          case "$PKG" in
            *.aab)
              echo; echo "##### 2) AAB / bundletool checks"
              JAR="$WORK/bundletool.jar"
              curl -fsSL -o "$JAR" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
              java -jar "$JAR" validate --bundle="$PKG"
              java -jar "$JAR" dump config --bundle="$PKG" | tee "$WORK/config.txt"
              if grep -q "PAGE_ALIGNMENT_4K" "$WORK/config.txt"; then
                echo "::error::16 KB PAGE SIZE CHECK: FAIL - BundleConfig requests 4 KB zip page alignment (PAGE_ALIGNMENT_4K)."
                exit 1
              fi
              grep -q "PAGE_ALIGNMENT_16K" "$WORK/config.txt" \
                && echo "BundleConfig: PAGE_ALIGNMENT_16K" \
                || echo "::warning::BundleConfig does not state PAGE_ALIGNMENT_16K explicitly; relying on the universal-APK zipalign check below."

              echo; echo "##### 3) Universal APK derived from the AAB"
              java -jar "$JAR" build-apks --bundle="$PKG" --output="$WORK/out.apks" --mode=universal --overwrite
              unzip -o -q "$WORK/out.apks" universal.apk -d "$WORK"
              python tools/verify_16kb.py "$WORK/universal.apk" --blame-dir .buildozer
              "$ZIPALIGN" -c -v -P 16 4 "$WORK/universal.apk" > "$WORK/zipalign.log" 2>&1 \
                || { echo "::error::zipalign: universal.apk is NOT 16 KB zip-aligned"; tail -n 40 "$WORK/zipalign.log"; exit 1; }
              echo "zipalign -P 16: universal.apk is correctly aligned."
              ;;
            *.apk)
              echo; echo "##### zipalign check of the APK"
              "$ZIPALIGN" -c -v -P 16 4 "$PKG" > "$WORK/zipalign.log" 2>&1 \
                || { echo "::error::zipalign: APK is NOT 16 KB zip-aligned"; tail -n 40 "$WORK/zipalign.log"; exit 1; }
              echo "zipalign -P 16: APK is correctly aligned."
              ;;
          esac
          echo; echo "ALL 16 KB CHECKS PASSED for $PKG"

      - name: Verify release AAB is signed with the expected upload certificate
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          EXPECTED_SHA1: "C4:3D:05:63:A6:AE:A0:3D:D9:5F:28:65:97:29:58:38:38:CD:BA:AD"
        run: |
          set -euo pipefail
          PKG_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          ACTUAL_SHA1=$(keytool -printcert -jarfile "$PKG_PATH" | grep -m1 "SHA1:" | sed 's/.*SHA1: //')
          echo "Expected upload cert SHA-1: $EXPECTED_SHA1"
          echo "Actual AAB signer SHA-1:    $ACTUAL_SHA1"
          [ "$ACTUAL_SHA1" = "$EXPECTED_SHA1" ] || { echo "::error::AAB is NOT signed with the expected upload certificate."; exit 1; }

      - name: Clean up temporary keystore file
        if: always()
        run: |
          [ -f "$GITHUB_WORKSPACE/release.keystore" ] && { shred -u "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/release.keystore"; } || true

      # Uploaded only if every check above passed.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheap4U-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_full.log
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
